<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b14">
<title>Khoidz Overflow • Cloud Phone</title>
<style>
:root{--bg:#090b14;--panel:#141827cc;--line:#ffffff18;--text:#f4f6ff;--muted:#98a2bd;--cyan:#70edff;--violet:#ad8bff;--green:#63f0b2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#2a205e 0,transparent 38%),radial-gradient(ellipse at 90% 20%,#10404c 0,transparent 34%),var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:36px 36px}
.wrap{max-width:1180px;margin:auto;padding:25px 18px 45px;position:relative}.top,.brand,.actions,.head,.stats,.specs,.cardbuttons{display:flex;align-items:center;gap:12px}.top,.head{justify-content:space-between;flex-wrap:wrap}.logo{width:45px;height:45px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#090b14;font-weight:950;font-size:17px;box-shadow:0 0 28px #70edff35}.brand h1{font-size:15px;letter-spacing:.7px;margin:0}.brand p{font-size:10px;letter-spacing:1.8px;color:var(--muted);margin:4px 0 0}.pill{padding:8px 11px;border:1px solid var(--line);border-radius:99px;background:#ffffff08;font-size:11px;color:#dbe2f7}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px;box-shadow:0 0 9px var(--green)}
.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:17px;margin:32px 0 27px}.panel,.device{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(16px);border-radius:22px;box-shadow:0 18px 60px #0003}.hero-main{padding:28px;overflow:hidden;position:relative}.eyebrow{color:var(--cyan);font-size:10px;font-weight:800;letter-spacing:2px}.hero h2{font-size:clamp(31px,5vw,48px);line-height:1.05;letter-spacing:-1.7px;margin:14px 0}.gradient{background:linear-gradient(90deg,var(--cyan),#c6a5ff);color:transparent;background-clip:text;-webkit-background-clip:text}.hero p{color:var(--muted);line-height:1.75;max-width:570px}.actions{flex-wrap:wrap;margin-top:22px}.btn{border:0;border-radius:11px;padding:12px 15px;font-size:12px;font-weight:800;cursor:pointer;transition:.18s}.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.primary{background:linear-gradient(110deg,var(--cyan),#b8a2ff);color:#080b14}.secondary{background:#ffffff08;border:1px solid var(--line);color:var(--text)}.hero-side{padding:23px;display:flex;flex-direction:column;justify-content:space-between;min-height:220px}.muted{color:var(--muted);font-size:11px}.big{font-size:35px;font-weight:850;letter-spacing:-1px;margin:7px 0}.bar{height:6px;border-radius:99px;background:#ffffff12;overflow:hidden;margin:12px 0}.bar span{display:block;height:100%;width:35%;background:linear-gradient(90deg,var(--cyan),var(--violet));border-radius:99px}.head{margin:26px 0 15px}.head h3{margin:0;font-size:18px}.head p{margin:5px 0 0;color:var(--muted);font-size:11px}.devices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.device{padding:16px;min-width:0}.device-top{display:flex;align-items:center;justify-content:space-between}.device-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,#173b49,#292047);border:1px solid var(--line);font-size:20px}.status{font-size:10px;border-radius:99px;padding:6px 8px;color:var(--green);border:1px solid #63f0b230;background:#63f0b20a}.device h4{font-size:15px;margin:14px 0 5px;overflow-wrap:anywhere}.sub{font-size:10px;color:var(--muted)}.preview{height:132px;border-radius:14px;margin:14px 0;background:radial-gradient(circle at 50% 30%,#6b68c533,transparent 42%),linear-gradient(145deg,#161b2e,#0b0d17);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative}.phone{width:59px;height:99px;border:2px solid #a4afcc;border-radius:12px;background:linear-gradient(145deg,#183749,#1d1738);display:grid;place-items:center;font-size:22px;box-shadow:0 0 25px #70edff16;position:relative}.phone:before{content:"";position:absolute;top:4px;width:17px;height:3px;border-radius:9px;background:#a4afcc}.preview label{position:absolute;bottom:8px;color:#8793b5;font-size:8px;letter-spacing:1.5px}.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.spec{padding:9px 7px;background:#ffffff06;border:1px solid #ffffff0a;border-radius:9px;min-width:0}.spec small{display:block;font-size:9px;color:var(--muted)}.spec b{display:block;font-size:11px;margin-top:4px;white-space:nowrap}.cardbuttons{margin-top:12px;gap:7px}.cardbuttons .btn{flex:1;padding:10px 7px;font-size:10px}.device-tabs{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 12px;margin-bottom:5px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:#ffffff07;color:var(--muted);border-radius:12px;padding:10px 13px;cursor:pointer;font:700 11px system-ui;max-width:220px;white-space:nowrap}
.tab.active{color:var(--cyan);border-color:#70edff70;background:#70edff12;box-shadow:0 0 20px #70edff0b}
.active-wrap{max-width:560px}.empty{text-align:center;padding:32px;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:#6e7894;font-size:9px;margin-top:24px}
.getkey-panel{margin:24px 0;padding:22px;border:1px solid #ad8bff40;background:linear-gradient(135deg,#17172acc,#101d2bcc);backdrop-filter:blur(16px);border-radius:22px;box-shadow:0 18px 60px #0003}
